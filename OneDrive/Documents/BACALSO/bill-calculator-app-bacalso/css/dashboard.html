<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dashboard — Electric Bill</title>
<style>
:root{--primary:#007bff;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(180deg,#f7fbff,#eef4ff);min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:white;box-shadow:0 6px 20px rgba(12,24,60,.04)}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#005fcc);display:flex;align-items:center;justify-content:center;color:white}
.container{padding:18px;max-width:1100px;margin:20px auto;display:grid;grid-template-columns:1fr 320px;gap:20px}
.panel{background:white;padding:18px;border-radius:12px;box-shadow:0 10px 30px rgba(12,24,60,.05)}
.grid{display:grid;gap:12px}
.cardBtn{display:flex;gap:12px;align-items:center;padding:14px;border-radius:10px;border:1px solid #eef6ff;cursor:pointer;transition:transform .14s}
.cardBtn:hover{transform:translateY(-6px)}
.cardBtn svg{width:36px;height:36px}
.stat{font-weight:700;font-size:18px}
.small{color:var(--muted);font-size:13px}
@media(max-width:900px){
  .container{grid-template-columns:1fr}
}
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">EB</div>
      <div>
        <div style="font-weight:700">Dashboard</div>
        <div style="font-size:13px;color:var(--muted)">Welcome — quick actions</div>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="small" id="userEmail"></div>
      <button style="background:transparent;border:none;color:var(--primary);font-weight:700;cursor:pointer" onclick="handleLogout()">Sign out</button>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-weight:700">Quick actions</div>
        <div class="small">Tap to open</div>
      </div>

      <div class="grid">
        <div class="cardBtn" onclick="location.href='calculator.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 7h8M8 11h8M8 15h8"/></svg>
          <div>
            <div style="font-weight:700">New Calculation</div>
            <div class="small">Start a fresh estimate</div>
          </div>
        </div>

        <div class="cardBtn" onclick="location.href='result-history.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="1.8"><path d="M3 7h18M7 21V7"/></svg>
          <div>
            <div style="font-weight:700">History</div>
            <div class="small">View saved results</div>
          </div>
        </div>

        <div class="cardBtn" onclick="location.href='profile.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M6 20c1.5-4 4.5-6 6-6s4.5 2 6 6"/></svg>
          <div>
            <div style="font-weight:700">Profile</div>
            <div class="small">Edit your details</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div style="margin-bottom:10px;font-weight:700">Summary</div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div class="stat" id="count">0</div><div class="small">Saved calculations</div></div>
          <div><button onclick="clearHistory()" style="background:#fff;border:1px solid #f0f6ff;padding:8px 10px;border-radius:8px;cursor:pointer">Clear</button></div>
        </div>
        <div><div class="small">Recent</div><div id="recent" style="margin-top:8px"></div></div>
      </div>
    </div>
  </div>

<script>
// Check authentication on page load
document.addEventListener('DOMContentLoaded', async () => {
  const session = await redirectIfNotAuthenticated();
  if (session) {
    const user = await getCurrentUser();
    if (user) {
      document.getElementById('userEmail').textContent = user.email;
      await loadCalculations();
    }
  }
});

async function loadCalculations() {
  const user = await getCurrentUser();
  if (!user) return;
  
  try {
    const { data, error } = await supabaseClient
      .from('calculations')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading calculations:', error);
      return;
    }
    
    document.getElementById('count').textContent = data ? data.length : 0;
    
    const recent = document.getElementById('recent');
    if (data && data.length > 0) {
      recent.innerHTML = data.slice(0, 3).map(h => `
        <div style="padding:8px;border-radius:8px;background:#f8fbff;margin-bottom:6px">
          ₱${parseFloat(h.result).toFixed(2)} • ${new Date(h.created_at).toLocaleDateString()}
        </div>
      `).join('');
    } else {
      recent.innerHTML = '<div class="small">No recent calculations.</div>';
    }
  } catch (error) {
    console.error('Error:', error);
  }
}

async function handleLogout() {
  const success = await signOut();
  if (success) {
    window.location.href = 'login.html';
  } else {
    alert('Error logging out. Please try again.');
  }
}

function clearHistory(){
  if(!confirm('Clear all saved calculations?')) return;
  localStorage.removeItem('history');
  location.reload();
}
</script>

<!-- Supabase JS library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Your configuration -->
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
