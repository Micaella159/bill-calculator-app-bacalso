<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>History — Electric Bill</title>
<style>
:root{--primary:#007bff;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(180deg,#f4f7fb,#eef4ff);padding:18px;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.container{max-width:900px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:white;padding:14px;border-radius:12px;box-shadow:0 8px 30px rgba(12,24,60,.04);display:flex;justify-content:space-between;align-items:center}
.meta{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px}
.btn{padding:10px 12px;border-radius:10px;border:none;background:var(--primary);color:white;cursor:pointer}
.ghost{background:transparent;border:1px solid rgba(12,24,60,.06);color:var(--muted)}
.empty{padding:30px;border-radius:12px;background:white;text-align:center;color:var(--muted);box-shadow:0 8px 30px rgba(12,24,60,.03)}
@media(max-width:600px){.item{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2 style="margin:0">Calculation history</h2>
        <div class="meta" id="count"></div>
      </div>
      <div class="controls">
        <button class="btn" onclick="exportCSV()">Export CSV</button>
        <button class="ghost" onclick="clearAll()">Clear all</button>
        <button style="background:transparent;border:none;color:var(--primary);cursor:pointer" onclick="location.href='dashboard.html'">Back</button>
      </div>
    </div>

    <div id="list" class="list"></div>
  </div>

<script>
// Check authentication on page load
document.addEventListener('DOMContentLoaded', async () => {
  const session = await redirectIfNotAuthenticated();
  if (session) {
    await loadCalculations();
  }
});

function format(v){return Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}

async function loadCalculations() {
  const user = await getCurrentUser();
  if (!user) return;
  
  try {
    const { data, error } = await supabaseClient
      .from('calculations')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading calculations:', error);
      alert('Error loading calculations: ' + error.message);
      return;
    }
    
    render(data || []);
  } catch (error) {
    console.error('Error:', error);
    alert('Error loading calculations: ' + error.message);
  }
}

function render(history){
  document.getElementById('count').textContent = history.length + ' saved entries';
  const list = document.getElementById('list');
  if(history.length===0){
    list.innerHTML='<div class="empty">No saved calculations yet. Go to Calculator to create one.</div>';
    return;
  }
  list.innerHTML = history.map((h,i)=>`
    <div class="item">
      <div>
        <div style="font-weight:700">₱${format(h.result)}</div>
        <div class="meta">${h.power_consumption} kWh • ₱${format(h.cost_per_kwh)}</div>
      </div>
      <div style="text-align:right">
        <div class="meta">${new Date(h.created_at).toLocaleDateString()}</div>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
          <button onclick="deleteItem(${h.id})" style="padding:8px;border-radius:8px;border:none;background:#ff4666;color:white;cursor:pointer">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function deleteItem(id){
  if(!confirm('Delete this entry?')) return;
  
  try {
    const { error } = await supabaseClient
      .from('calculations')
      .delete()
      .eq('id', id);
    
    if (error) {
      alert('Error deleting calculation: ' + error.message);
      return;
    }
    
    await loadCalculations();
  } catch (error) {
    alert('Error deleting calculation: ' + error.message);
  }
}

async function clearAll(){
  if(!confirm('Clear all saved calculations?')) return;
  
  const user = await getCurrentUser();
  if (!user) return;
  
  try {
    const { error } = await supabaseClient
      .from('calculations')
      .delete()
      .eq('user_id', user.id);
    
    if (error) {
      alert('Error clearing calculations: ' + error.message);
      return;
    }
    
    await loadCalculations();
  } catch (error) {
    alert('Error clearing calculations: ' + error.message);
  }
}

async function exportCSV(){
  const user = await getCurrentUser();
  if (!user) return;
  
  try {
    const { data, error } = await supabaseClient
      .from('calculations')
      .select('*')
      .eq('user_id', user.id);
    
    if (error) throw error;
    if(!data || data.length===0) return alert('No data to export');
    
    const rows = [['date','kwh','rate','total'],...data.map(h=>[new Date(h.created_at).toLocaleDateString(),h.power_consumption,h.cost_per_kwh,h.result])];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'electric_history.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch (error) {
    alert('Error exporting data: ' + error.message);
  }
}
</script>

<!-- Supabase JS library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Your configuration -->
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
