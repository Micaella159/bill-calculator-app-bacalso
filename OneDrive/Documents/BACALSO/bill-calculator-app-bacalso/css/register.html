<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Register — Electric Bill</title>
<style>
:root{--primary:#007bff;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:linear-gradient(180deg,#f4f7fb,#eef4ff);display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:100%;max-width:460px;background:#fff;padding:26px;border-radius:14px;box-shadow:0 12px 40px rgba(9,30,80,.06);animation:slideIn .4s ease}
h2{margin:0 0 6px 0}
.lead{color:var(--muted);font-size:14px;margin-bottom:18px}
.form{display:grid;gap:10px}
.input{padding:12px;border-radius:10px;border:1px solid #e6eefc;font-size:15px}
.btn{padding:12px;border-radius:10px;border:none;background:var(--primary);color:white;font-weight:700;cursor:pointer}
.small{font-size:13px;color:var(--muted);margin-top:10px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <div class="card">
    <h2>Create account</h2>
    <div class="lead">Register a profile </div>

    <div class="form">
      <input id="fullname" class="input" placeholder="Full name" type="text" autocomplete="name">
      <input id="email" class="input" placeholder="Email" type="email" autocomplete="email">
      <input id="pass" class="input" placeholder="Password" type="password" autocomplete="new-password">
      <input id="confirm" class="input" placeholder="Confirm password" type="password" autocomplete="new-password">
      <button class="btn" onclick="register()">Create account</button>
      <div class="small">Already have account? <a href="login.html">Sign in</a></div>
    </div>
  </div>

<script>
function register(){
  const name = document.getElementById('fullname').value.trim();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const confirm = document.getElementById('confirm').value;
  if(!name || !email || !pass || !confirm) return alert('Fill all fields.');
  if(pass !== confirm) return alert('Passwords do not match.');
  // store basic profile to localStorage
  localStorage.setItem('profile', JSON.stringify({name,email}));
  alert('Account created . Redirecting to login.');
  location.href='login.html';
}
</script>

<!-- Supabase JS library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Your configuration -->
<script src="../js/supabase-config.js"></script>
<script src="../js/db-functions.js"></script>
</body>
</html>
